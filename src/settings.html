<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixi Scene Inspector</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1a1f2b;
      --muted: #5c6578;
      --line: #d8dde8;
      --accent: #1a1f2b;
      --focus: #3b82f6;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    h1 {
      margin: 0 0 14px;
      font-size: 14px;
      font-weight: 700;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .label {
      font-weight: 600;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #shortcut {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      font: inherit;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text);
      text-align: center;
      cursor: pointer;
      background: #f0f2f6;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    #shortcut:focus {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    #shortcut[data-recording="true"] {
      color: var(--focus);
      background: #eff6ff;
      border-color: var(--focus);
    }

    button {
      padding: 8px 10px;
      font: inherit;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    button:hover {
      background: #eef1f6;
    }

    #status {
      min-height: 1.2em;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    #status[data-tone="error"] {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <h1>Pixi Scene Inspector</h1>
  <div class="field">
    <div class="label">Toggle shortcut</div>
    <p class="hint">Click the field, then press the key combination. At least one modifier is required.</p>
    <div class="row">
      <input id="shortcut" type="text" readonly value="" aria-label="Toggle shortcut" />
      <button id="reset" type="button">Reset</button>
    </div>
  </div>
  <p id="status" aria-live="polite"></p>
  <script src="settings.js"></script>
</body>
</html>
